		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", function(event) {
				console.log(new Date().getHours().toString() + ":" + new Date().getMinutes().toString());

				updateSunMark();
				setInterval(updateSunMark, 1000);
			});

			function updateSunMark() { document.getElementById("sun-mark").style.transform = "rotate("+getSunAngle().toString()+"deg)"; }
			function getSunAngle() {
				let d = new Date();
				let dayProgress = (d.getHours() + d.getMinutes() / 60.0) / 24.0;
				return (360 * dayProgress) - 180;
			}
		</script>
