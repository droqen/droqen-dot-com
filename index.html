			function updateSunMark() { document.getElementById("sun-mark").style.transform = "rotate("+getSunAngle().toString()+"deg)"; }
			function getSunAngle() {
				let d = new Date();
				let dayProgress = (d.getHours() + d.getMinutes() / 60.0) / 24.0;
